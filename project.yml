name: Jaca
options:
  bundleIdPrefix: dev.srsouza
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

packages:
  Lemonade:
    path: ../lemonade-design-system
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.65.0"
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    from: "2.27.0"
  swift-certificates:
    url: https://github.com/apple/swift-certificates.git
    from: "1.5.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.5.0"
  swift-asn1:
    url: https://github.com/apple/swift-asn1.git
    from: "1.2.0"
  grpc-swift:
    url: https://github.com/grpc/grpc-swift.git
    from: "1.27.0"
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    # Ad-hoc local signing so the app runs without a dev account and can spawn
    # adb/xcrun via Process (no App Sandbox).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO

targets:
  Jaca:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Lemonade
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-nio
        product: NIOFoundationCompat
      - package: swift-nio-ssl
        product: NIOSSL
      - package: swift-certificates
        product: X509
      - package: swift-crypto
        product: Crypto
      - package: swift-asn1
        product: SwiftASN1
      - package: grpc-swift
        product: GRPC
      - package: swift-protobuf
        product: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.srsouza.Jaca
        PRODUCT_NAME: Jaca
        # Small Objective-C bridge for physical-device structured logs (LoggingSupport
        # private API). See Sources/Core/Logs/JacaOSLog.{h,m} + investigate-loggingsupport skill.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Jaca-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # macOS Local Network privacy: without these the in-app NWBrowser can't discover the
        # companion over mDNS (the system dns-sd still can), so the desktop never connects.
        # NSBonjourServices (an array) can't be set via INFOPLIST_KEY_, so build.sh injects it
        # into the built Info.plist post-build and re-seals.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Jaca finds and connects to companion devices on your local network to capture their traffic."
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      # Compile the in-process iOS-Simulator network agent (arm64) into the app's
      # Resources. It's an iphonesimulator dylib (different platform from this macOS
      # app), so it's built with clang here rather than as a linked target. Injected
      # into debug apps via DYLD_INSERT_LIBRARIES — see Sources/Core/Network/
      # IOSSimulatorAgentController.swift + the reverse-engineer-apple-private-api skill.
      # Runs before Xcode's final code-sign, so it's covered by the app signature.
      - name: Build iOS Simulator network agent
        basedOnDependencyAnalysis: false
        script: |
          # Every agent/iOS/*.m: the agent is three files (tap+divert client, transport, and the
          # Divert.kt twin). The glob is deliberately non-recursive, so a subdirectory can never be
          # linked into the dylib.
          OUT="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/JacaNetAgent.dylib"
          mkdir -p "$(dirname "$OUT")"
          if ! xcrun -sdk iphonesimulator clang -dynamiclib -fobjc-arc \
               -target arm64-apple-ios15.0-simulator -framework Foundation \
               -I "$SRCROOT/agent/iOS" \
               -o "$OUT" "$SRCROOT"/agent/iOS/*.m; then
            echo "error: failed to build the iOS-Simulator network agent (JacaNetAgent.dylib)." >&2
            echo "error: it needs the iOS Simulator SDK — install it in Xcode > Settings > Components (iOS platform), then rebuild." >&2
            exit 1
          fi
      # Records where this build came from + which commit it built, so the in-app
      # updater can compare against origin/main and pull/rebuild. Written to a
      # sidecar (not the bundle) so it never invalidates the ad-hoc code signature.
      - name: Write build-info sidecar
        basedOnDependencyAnalysis: false
        script: |
          DIR="$HOME/Library/Application Support/Jaca"
          mkdir -p "$DIR"
          COMMIT=$(cd "$SRCROOT" && git rev-parse HEAD 2>/dev/null || echo "")
          printf '{"repoPath": "%s", "buildCommit": "%s"}\n' "$SRCROOT" "$COMMIT" > "$DIR/build-info.json"

  JacaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
        # Tests/ObjC is the agent's own suite (JacaAgentTests): plain Objective-C against
        # agent/iOS sources, with no Jaca module to import. Compiling it in here too would need a
        # bridging header and would link the agent into the desktop test bundle.
        excludes:
          - ObjC
    dependencies:
      - target: Jaca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.srsouza.JacaTests
        GENERATE_INFOPLIST_FILE: YES

  # The agent's decisions, tested on the host. agent/iOS/JacaDivert.m uses no iOS-only API for
  # exactly this reason: the dead-man window, the host match and the 599 bounce pair are the parts
  # a mistake in makes an app either uncapturable or permanently pointed at a dead port, and
  # "rebuild the dylib, launch a simulator, launch an app" is far too slow a loop to catch them.
  JacaAgentTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ObjC
      - path: agent/iOS/JacaDivert.h
      - path: agent/iOS/JacaDivert.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.srsouza.JacaAgentTests
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/agent/iOS

  JacaUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: UITests
    dependencies:
      - target: Jaca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.srsouza.JacaUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Jaca

schemes:
  Jaca:
    build:
      targets:
        Jaca: all
        JacaTests: [test]
        JacaAgentTests: [test]
        JacaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JacaTests
        - JacaAgentTests
        - JacaUITests
